name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prisma needs a datasource URL present to validate/generate the client. CI
  # contacts no database: the unit suites are pure (mocked Prisma, in-memory
  # delegates) and the integration/E2E suites are opt-in locally.
  DATABASE_URL: postgresql://flowbridge:flowbridge@localhost:5432/flowbridge

jobs:
  verify:
    name: lint · typecheck · test · prisma
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma validate
        run: pnpm --filter @flowbridge/db exec prisma validate

      - name: Prisma generate
        run: pnpm --filter @flowbridge/db run db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Core coverage gate (≥70%)
        run: pnpm --filter @flowbridge/core test:coverage

      - name: Build (Next.js)
        # Catches deploy-only breakage (edge bundling, bad route export) that
        # lint/typecheck/unit tests cannot see. DB-backed pages read request
        # data (auth/cookies) and stay dynamic, so no live database is needed.
        run: pnpm --filter @flowbridge/web run build

  integration:
    name: integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flowbridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A dedicated, empty scratch database — the integration suite refuses to
      # run against one that already has data.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flowbridge_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flowbridge_test
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @flowbridge/db run db:generate

      - name: Apply schema to the scratch database
        run: pnpm --filter @flowbridge/db exec prisma db push --skip-generate

      - name: Integration tests
        run: pnpm --filter @flowbridge/web test:integration
